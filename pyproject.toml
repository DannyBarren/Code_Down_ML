[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-down-ml"
version = "1.1.0"
description = "Code_Down_ML v1.1. Strict-first, auditable transaction coding: keyword rules + client-scoped learned memory + similarity + optional per-client ML, with a group-first Review workspace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Danny Barren" }]
keywords = ["automation", "classification", "machine-learning", "streamlit", "setfit", "transactions"]

dependencies = [
    "pandas==3.0.6",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "streamlit==1.66.0",
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    "structlog==26.1.0",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
# Best-accuracy semantic matching + the optional SetFit trainable model.
# Not installed in CI. transformers stays on the 4.x line (SetFit compat).
semantic = [
    "sentence-transformers==3.4.1",
    "torch==2.5.1",
    "setfit==1.1.3",
    "transformers>=4.41,<5",
]
# Test / development tooling.
dev = [
    "pytest==9.1.1",
]

[project.scripts]
code-down = "cli:main"

[tool.setuptools]
py-modules = ["main", "cli", "smoke_test"]

[tool.setuptools.packages.find]
include = ["src*", "utils*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
